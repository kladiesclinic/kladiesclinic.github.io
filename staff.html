<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>スタッフ — K Ladies Clinic</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232B2124'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='bold' fill='%23FFFFFF'%3EK%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans JP', sans-serif; background: #FBF7F4; color: #2B2124;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 32px 20px 48px;
  }
  .logo { height: 36px; margin-bottom: 8px; }
  .tag { font-size: 12px; color: #A8968F; letter-spacing: 0.2em; margin-bottom: 36px; }
  .menu { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
  .big-btn {
    display: flex; align-items: center; gap: 16px;
    background: #FFFFFF; border: 1px solid #E9DDD6; border-radius: 18px;
    padding: 24px 22px; text-decoration: none; color: #2B2124;
    font-size: 19px; font-weight: 700;
    box-shadow: 0 2px 10px rgba(43,33,36,0.05);
  }
  .big-btn:active { transform: scale(0.99); }
  .big-btn .icon { font-size: 30px; }
  .big-btn small { display: block; font-size: 12.5px; font-weight: 400; color: #7A6A66; margin-top: 3px; }
  .big-btn.main { background: #2B2124; color: #FBF7F4; border-color: #2B2124; }
  .big-btn.main small { color: #C9BCB6; }
  .big-btn.pending { opacity: 0.45; pointer-events: none; }
  .note {
    max-width: 480px; width: 100%; margin-top: 28px;
    font-size: 13px; line-height: 1.9; color: #7A6A66;
    background: #FFFFFF; border: 1px solid #E9DDD6; border-radius: 14px; padding: 16px 18px;
  }
  .note strong { color: #2B2124; }
</style>
</head>
<body>

<img class="logo" src="assets/logo_en.png" alt="K Ladies Clinic Shinjuku" />
<div class="tag">スタッフ用</div>

<div class="menu">
  <a class="big-btn main" href="https://calendly.com/app/scheduled_events/user/me" target="_blank" rel="noopener">
    <span class="icon">📅</span>
    <span>予約一覧・Zoom入室<small>時間順に患者名と「Join」ボタンが並びます</small></span>
  </a>

  <a class="big-btn" href="https://mail.google.com/mail/u/0/#search/%E5%95%8F%E8%A8%BA%E7%A5%A8" target="_blank" rel="noopener">
    <span class="icon">📄</span>
    <span>問診票メールを開く<small>件名「【問診票】患者名」で検索した受信トレイ</small></span>
  </a>

  <a class="big-btn" href="https://calendly.com/app/scheduling/meeting_types/user/me" target="_blank" rel="noopener">
    <span class="icon">⚙️</span>
    <span>診察枠の設定<small>時間変更・休診・予約の一時停止</small></span>
  </a>

  <a class="big-btn" href="manual.html">
    <span class="icon">📖</span>
    <span>マニュアル<small>予約から発送までの手順・英語返信例</small></span>
  </a>
</div>

<div class="note">
  <strong>問診票は自動で日本語で届きます</strong> — 患者が送信すると
  <strong>staff@klcs.jp に「【問診票】患者名（生年月日）」</strong>という件名で、
  項目も回答も日本語に訳された表が届きます（英語の原文はカッコ内に併記）。
  メールをそのまま <strong>Ctrl+P でA4印刷</strong>して医師にお渡しください。
</div>

</body>
</html>
